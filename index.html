<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menu PT·RU</title>
  <meta name="description" content="Португальские меню: словарь продуктов, поиск блюд, карточки">
  <meta name="theme-color" content="#1f4fa3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Menu PT">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Menu</div>
        <div class="brand-sub">português → русский</div>
      </div>
    </div>
    <span id="net" class="net" hidden>офлайн</span>
    <button id="open-settings" class="icon-btn" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8.3 4.6-1.9 1.1.1 2.2-2.2.9-.9 2.1h-2.2L12 21l-1.2-1.5H8.6l-.9-2.1-2.2-.9.1-2.2-1.9-1.1L3.5 11l1.9-1.1-.1-2.2 2.2-.9.9-2.1h2.2L12 3l1.2 1.7h2.2l.9 2.1 2.2.9-.1 2.2 1.9 1.1-.6 2.2Z"/></svg>
    </button>
  </header>

  <main>
    <!-- Словарь -->
    <section id="view-dict" class="view" data-view="dict">
      <div class="sticky-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
          <input id="dict-q" type="search" placeholder="Фильтр: слово на PT, RU или EN" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <div id="dict-cats" class="chips" role="tablist" aria-label="Категории"></div>
      </div>
      <div id="dict-count" class="count"></div>
      <div class="dict-wrap">
        <div id="dict-list" class="dict-list"></div>
        <nav id="dict-letters" class="letters" aria-label="Буквы"></nav>
      </div>
    </section>

    <!-- Поиск блюд -->
    <section id="view-search" class="view" data-view="search" hidden>
      <div class="sticky-tools">
        <label class="search big">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
          <input id="search-q" type="search" placeholder="Название блюда: bacalhau, осьминог, prego…" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
      </div>
      <div id="search-results"></div>
    </section>

    <!-- Карточки -->
    <section id="view-cards" class="view" data-view="cards" hidden>
      <div class="cards-tools">
        <div class="seg" role="radiogroup" aria-label="Направление">
          <button data-dir="pt-ru" class="on" role="radio" aria-checked="true">PT → RU</button>
          <button data-dir="ru-pt" role="radio" aria-checked="false">RU → PT</button>
        </div>
        <select id="cards-deck" aria-label="Набор карточек"></select>
      </div>
      <div id="cards-stats" class="count"></div>
      <div class="card-stage">
        <button id="card" class="flashcard" aria-live="polite">
          <div class="face front"><div class="card-label"></div><div class="card-word"></div><div class="card-hint">нажми, чтобы перевернуть</div></div>
          <div class="face back"><div class="card-label"></div><div class="card-word"></div><div class="card-extra"></div></div>
        </button>
      </div>
      <form id="card-answer" class="answer" hidden autocomplete="off">
        <input id="card-input" placeholder="Напиши по-португальски…" autocapitalize="off" spellcheck="false">
        <button type="submit" class="btn">Проверить</button>
      </form>
      <div id="card-verdict" class="verdict" hidden></div>
      <div class="card-actions">
        <button id="card-no" class="btn btn-no">Не помню</button>
        <button id="card-speak" class="icon-btn" aria-label="Произнести">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4V9Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
        </button>
        <button id="card-yes" class="btn btn-yes">Помню</button>
      </div>
    </section>

    <!-- Мои меню -->
    <section id="view-menus" class="view" data-view="menus" hidden>
      <div class="menus-head">
        <h2>Мои меню</h2>
        <button id="add-menu" class="btn">＋ Добавить меню</button>
      </div>
      <div id="queue-note" class="note" hidden></div>
      <div id="menus-list" class="menus-list"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Разделы">
    <a href="#dict" data-tab="dict">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3h11a3 3 0 0 1 3 3v15H7a2 2 0 0 1-2-2V3Zm2 2v12h10V6a1 1 0 0 0-1-1H7Zm0 14h10v-0H7Z"/></svg>
      <span>Словарь</span>
    </a>
    <a href="#search" data-tab="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
      <span>Блюда</span>
    </a>
    <a href="#cards" data-tab="cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm0 2v11h12V8H4Zm16 9V5a1 1 0 0 0-1-1H6V2h13a3 3 0 0 1 3 3v12h-2Z"/></svg>
      <span>Карточки</span>
    </a>
    <a href="#menus" data-tab="menus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5L9 4Zm3 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
      <span>Меню</span>
    </a>
  </nav>

  <!-- Нижние листы (sheet) -->
  <dialog id="sheet" class="sheet">
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="icon-btn" data-close aria-label="Закрыть">✕</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </dialog>

  <dialog id="photo-view" class="photo-view">
    <img alt="Фото меню">
    <button class="icon-btn" data-close aria-label="Закрыть">✕</button>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
